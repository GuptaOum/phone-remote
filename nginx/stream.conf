# ── Port 443 front door: route TLS by hostname (SNI) without decrypting ──────
#   turn.<domain>  → TURN over TLS (below) → coturn
#   anything else  → the website (http server in default.conf)
# Strict networks that only allow HTTPS can still reach our TURN relay, so
# WebRTC works there instead of falling back to JPEG.
map $ssl_preread_server_name $tls_backend {
    turn.__DOMAIN__  127.0.0.1:8444;
    default          127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $tls_backend;
    # Pass the real client address on to the backends.
    proxy_protocol on;
}

# ── TURN over TLS (turns:turn.<domain>:443) ──────────────────────────────────
# nginx terminates TLS with the site's Let's Encrypt cert (it also covers
# turn.<domain>) and forwards plain TURN-over-TCP to coturn, which runs on the
# host network.
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_pass host.docker.internal:3478;
    proxy_timeout 1h;
}
