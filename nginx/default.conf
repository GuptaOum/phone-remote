map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Certbot challenge path for automated SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Public 443 is the SNI router in stream.conf; it hands website TLS
    # connections here with a PROXY header carrying the real client address.
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name _;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # SSL Certificate configuration
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Blue-green: two app containers (app-blue, app-green); only the live one
    # gets traffic. the server's deploy script writes the live colour into
    # /etc/nginx/live/app-upstream.conf (mounted from ~/phone-remote/.deploy)
    # and reloads nginx gracefully. A variable + Docker's resolver means nginx
    # starts even if that container is down, instead of refusing to boot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app-blue:3000;
    include /etc/nginx/live/*.conf;

    # Web Frontend (React + Vite) & Node.js Express Backend
    location / {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4096m;
    }
}
