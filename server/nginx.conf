# Phone Remote — Production Nginx Configuration
# Target path on server: /etc/nginx/sites-available/phoneremote
# Symlink: /etc/nginx/sites-enabled/phoneremote

server {
    server_name 3-6-239-48.sslip.io;

    # 1. SECURITY: Block external public access to internal companion bridge
    location /api/internal/ {
        return 403;
    }

    # 2. FastMCP SSE endpoint (Python port 8001)
    location /sse {
        proxy_pass http://127.0.0.1:8001/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # 3. FastMCP tool messages endpoint (Python port 8001)
    location /messages/ {
        proxy_pass http://127.0.0.1:8001/messages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 100m;
    }

    # 4. Node.js Express server (port 3000)
    # Serves: Web Dashboard, /mcp-test, /mcp, login, and live phone WebSockets (/ws)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4096m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/3-6-239-48.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/3-6-239-48.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirect HTTP -> HTTPS
server {
    if ($host = 3-6-239-48.sslip.io) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    server_name 3-6-239-48.sslip.io;
    return 404;
}
