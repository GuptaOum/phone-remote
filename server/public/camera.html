<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Camera — Phone Remote</title>
<link rel="stylesheet" href="/shared.css"/>
<style>
.camera-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 18px;
  background: radial-gradient(ellipse at center, #0f1018 0%, #0a0c10 100%);
  position: relative;
  overflow: hidden;
}

.cam-badge {
  position: absolute;
  top: 14px; left: 14px;
  z-index: 10;
  background: rgba(0,0,0,.65);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 2px 12px rgba(0,0,0,.4);
}
.cam-dot { width: 7px; height: 7px; border-radius: 50%; transition: background .3s, box-shadow .3s; }
.cam-dot.live {
  background: var(--green);
  box-shadow: 0 0 6px #22c55e88;
  animation: pulse 1.5s ease-in-out infinite;
}
.cam-dot.off  { background: var(--red); }
.cam-label    { color: #9ca3af; font-size: 11px; font-weight: 500; letter-spacing: .3px; }

.cam-canvas {
  display: none;
  object-fit: contain;
  border-radius: 16px;
  max-width: 90vw;
  max-height: calc(95vh - 110px);
  box-shadow: 0 8px 48px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
}

video.cam-canvas { background: #000; }

.cam-placeholder {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.9;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.cam-placeholder .cam-icon {
  width: 56px; height: 56px;
  border-radius: 18px;
  background: var(--bg3);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 4px;
}
.cam-placeholder small { color: #4b5563; font-size: 12px; }

.cam-controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 4px;
  background: rgba(255,255,255,.02);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px 8px;
}
</style>
</head>
<body>

<header class="header">
  <div class="status-dot" id="dot"></div>
  <span class="header-title">Phone Remote</span>
  <span class="header-status" id="status-text">Connecting...</span>
  <nav class="tab-bar">
    <a href="/mirror"   class="tab-btn">📱 Screen</a>
    <a href="/camera"   class="tab-btn active">📷 Camera</a>
    <a href="/files"    class="tab-btn">📁 Files</a>
    <a href="/location" class="tab-btn">📍 Location</a>
    <a href="/mcp-test" class="tab-btn">🧪 MCP Test</a>
  </nav>
</header>

<div class="camera-main">
  <div class="cam-badge">
    <div class="cam-dot off" id="cam-dot"></div>
    <span class="cam-label" id="cam-label">Camera off</span>
  </div>

  <canvas id="cam-canvas" class="cam-canvas"></canvas>
  <!-- WebRTC view; shown instead of the JPEG canvas while video frames arrive -->
  <video id="cam-video" class="cam-canvas" autoplay playsinline muted></video>

  <div class="cam-placeholder" id="cam-placeholder">
    <div class="cam-icon">📷</div>
    Camera ready — select front or back.<br>
    <small>Works even when phone screen is off.</small>
  </div>

  <div class="cam-controls">
    <button class="btn primary" onclick="startCamera(true)">▶ Front</button>
    <button class="btn primary" onclick="startCamera(false)">▶ Back</button>
    <button class="btn"         onclick="flipCamera()">↔ Flip</button>
    <button class="btn danger"  onclick="stopCamera()">■ Stop</button>
  </div>
</div>

<div class="alert-banner" id="alert" style="display:none;" onclick="this.style.display='none'"></div>

<script src="/ws.js"></script>
<script>
const camCanvas      = document.getElementById('cam-canvas');
const camVideo       = document.getElementById('cam-video');
const camCtx         = camCanvas.getContext('2d');
const camDot         = document.getElementById('cam-dot');
const camLabel       = document.getElementById('cam-label');
const camPlaceholder = document.getElementById('cam-placeholder');
const alertEl        = document.getElementById('alert');

let live    = false;
let isFront = true;
// After the user hits Stop, frames already in flight keep arriving for a
// moment — ignore them so the view closes instantly instead of replaying
// the backlog. Auto-resync (frame → setLive) resumes after the window.
let suppressFramesUntil = 0;

const ws = createWS(handleMsg, handleBinary);

function handleMsg(msg) {
  switch (msg.type) {
    case 'camera_streaming':
      setLive(true);
      break;

    case 'camera_stopped':
      stopRtc();
      setLive(false);
      break;

    case 'camera_error':
      stopRtc();
      setLive(false);
      showAlert('Camera permission off. On the phone: Settings → Apps → Phone Remote → enable Camera.');
      break;

    case 'phone_disconnected':
      setLive(false);
      stopRtc();
      break;

    case 'rtc_config':
      if (Array.isArray(msg.iceServers) && msg.iceServers.length) RTC_CONFIG = { iceServers: msg.iceServers };
      break;

    case 'rtc_answer':
      if (!rtc || msg.kind !== 'camera') break;
      rtc.setRemoteDescription({ type: 'answer', sdp: msg.sdp })
        .then(() => {
          rtcPendingIce.splice(0).forEach(c => rtc && rtc.addIceCandidate(c).catch(() => {}));
        })
        .catch(rtcFail);
      break;

    case 'rtc_ice':
      if (!rtc || !msg.candidate || msg.kind !== 'camera') break;
      if (rtc.remoteDescription) rtc.addIceCandidate(msg.candidate).catch(() => {});
      else rtcPendingIce.push(msg.candidate);
      break;

    case 'rtc_error':
    case 'rtc_unsupported':
      if (msg.kind === 'camera') rtcFail();
      break;
  }
}

// ── WebRTC: JPEG starts the view instantly; we then offer a peer connection
// and the server moves the phone's camera over to it once we're connected
// (direct, or relayed by our TURN server on strict networks like cellular).
// Whichever source delivered the latest frame is shown, so falling back to
// JPEG needs no extra signalling here.
let RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let rtc = null;
let rtcGaveUp = false;
let rtcTimer = null;
let rtcPendingIce = [];
let lastVideoFrameAt = 0;

function showVideo(on) {
  camVideo.style.display  = on && live ? 'block' : 'none';
  camCanvas.style.display = !on && live ? 'block' : 'none';
}

function startRtc() {
  if (rtc || rtcGaveUp || !window.RTCPeerConnection) return;
  const pc = rtc = new RTCPeerConnection(RTC_CONFIG);
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.onicecandidate = ({ candidate }) => {
    if (candidate && candidate.candidate) ws.send({ type: 'rtc_ice', kind: 'camera', candidate: candidate.toJSON() });
  };
  pc.ontrack = ({ streams, track }) => {
    camVideo.srcObject = streams[0] || new MediaStream([track]);
    watchVideoFrames(pc);
  };
  pc.onconnectionstatechange = () => {
    if (pc !== rtc) return;
    const s = pc.connectionState;
    if (s === 'connected') {
      clearTimeout(rtcTimer);
      ws.send({ type: 'rtc_ready', kind: 'camera' });
    } else if (s === 'failed') {
      rtcFail();
    } else if (s === 'disconnected') {
      // Often recovers on its own; JPEG covers the gap meanwhile.
      clearTimeout(rtcTimer);
      rtcTimer = setTimeout(() => { if (pc === rtc && pc.connectionState !== 'connected') rtcFail(); }, 5000);
    }
  };
  // Relay included, so 15s is generous; after that, stay on JPEG.
  rtcTimer = setTimeout(() => { if (pc === rtc && pc.connectionState !== 'connected') rtcFail(); }, 15000);
  pc.createOffer()
    .then(o => pc.setLocalDescription(o))
    .then(() => { if (pc === rtc) ws.send({ type: 'rtc_offer', kind: 'camera', sdp: pc.localDescription.sdp }); })
    .catch(rtcFail);
}

function rtcFail() {
  const had = !!rtc;
  stopRtc();
  rtcGaveUp = true;  // retried on the next Front/Back
  if (had) ws.send({ type: 'rtc_failed', kind: 'camera' });
}

function stopRtc() {
  clearTimeout(rtcTimer);
  rtcPendingIce = [];
  if (rtc) { const pc = rtc; rtc = null; pc.close(); }
  camVideo.srcObject = null;
  lastVideoFrameAt = 0;
  showVideo(false);
}

function watchVideoFrames(pc) {
  const onFrame = () => {
    if (pc !== rtc || Date.now() < suppressFramesUntil) return;
    lastVideoFrameAt = Date.now();
    setLive(true);
    showVideo(true);
  };
  if (camVideo.requestVideoFrameCallback) {
    const tick = () => { if (pc !== rtc) return; onFrame(); camVideo.requestVideoFrameCallback(tick); };
    camVideo.requestVideoFrameCallback(tick);
  } else {
    camVideo.onresize = onFrame;
    camVideo.onplaying = onFrame;
  }
}

function setLive(on) {
  live = on;
  camDot.className   = 'cam-dot ' + (on ? 'live' : 'off');
  camLabel.textContent = on ? 'Live' : 'Camera off';
  camPlaceholder.style.display = on ? 'none'  : 'block';
  showVideo(on && !!rtc && Date.now() - lastVideoFrameAt < 1000);
}

function handleBinary(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes[0] !== 0x02) return;  // not a camera frame
  if (Date.now() < suppressFramesUntil) return;  // stale frames after Stop
  // Just switched to WebRTC: a JPEG still in flight must not cover the video.
  if (rtc && Date.now() - lastVideoFrameAt < 1000) return;
  // Always sync live state — handles BFCache/reconnect scenarios
  setLive(true);
  showVideo(false);
  startRtc();
  createImageBitmap(new Blob([bytes.subarray(1)], { type: 'image/jpeg' }))
    .then(bitmap => {
      camCanvas.width  = bitmap.height;
      camCanvas.height = bitmap.width;
      camCtx.save();
      if (isFront) {
        camCtx.translate(0, bitmap.width);
        camCtx.rotate(-Math.PI / 2);
      } else {
        camCtx.translate(bitmap.height, 0);
        camCtx.rotate(Math.PI / 2);
      }
      camCtx.drawImage(bitmap, 0, 0);
      camCtx.restore();
      bitmap.close();
    });
}

function startCamera(front) {
  suppressFramesUntil = 0; isFront = front;
  stopRtc(); rtcGaveUp = false;  // fresh peer per start; the server restarts us on JPEG
  ws.send({ type: 'camera_start', front });
}
function flipCamera()       { isFront = !isFront; ws.send({ type: 'camera_flip' }); }
function stopCamera()       { ws.send({ type: 'camera_stop' }); stopRtc(); setLive(false); suppressFramesUntil = Date.now() + 4000; }

function showAlert(msg) {
  alertEl.textContent = msg;
  alertEl.style.display = 'block';
}
</script>
</body>
</html>
