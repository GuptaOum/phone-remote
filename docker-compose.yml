services:
  # 1. Reverse Proxy (Nginx with SSL termination & WebSocket routing)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: oumgupta/phone-remote-nginx:latest
    container_name: phone-remote-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-65-1-96-152.sslip.io}
    # TURN-over-TLS is forwarded to coturn, which runs on the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot (on the host) writes HTTP-01 challenges here for renewals
      - /var/www/certbot:/var/www/certbot:ro
      # Which app colour is live (written by the server's deploy script)
      - ./.deploy:/etc/nginx/live:ro

  # 2. Web Frontend (React + Vite) & Express Node.js Backend — blue-green.
  #    Two identical services share one image; only the live colour runs and
  #    gets traffic. A deploy starts the other colour with the new image,
  #    health-checks it, switches nginx to it, then stops the old one.
  #    Deploy with the server's deploy script (or a push to main), not `compose up`.
  app-blue: &app
    build:
      context: .
      dockerfile: Dockerfile
    image: oumgupta/phone-remote-app:latest
    container_name: phone-remote-app-blue
    restart: unless-stopped
    stop_grace_period: 15s
    expose:
      - "3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - FILE_DIR=/app/filestore
      - TURN_SECRET_FILE=/run/turn/secret
      # TURN over TLS on 443 (nginx routes this hostname to coturn); the
      # site's cert must also cover it.
      - TURN_TLS_HOST=turn.${DOMAIN:-65-1-96-152.sslip.io}
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - ./server/data:/app/server/data
      # APK etc., served at the site root (e.g. /phone-remote.apk)
      - ./downloads:/app/downloads:ro
      - /home/ubuntu/PhoneRemote:/app/filestore
      - turn-secret:/run/turn:ro
    depends_on:
      turn-init:
        condition: service_completed_successfully

  app-green:
    <<: *app
    container_name: phone-remote-app-green

  # 3. One-shot: creates the TURN shared secret on first run, keeps it after.
  #    The app signs short-lived TURN credentials with it; coturn verifies them.
  turn-init:
    image: coturn/coturn:4.7.0
    container_name: phone-remote-turn-init
    user: "0"
    restart: "no"
    volumes:
      - turn-secret:/run/turn
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -s /run/turn/secret ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/turn/secret
          echo "TURN secret created"
        fi
        chmod 444 /run/turn/secret

  # 4. TURN/STUN relay for WebRTC when a direct phone↔browser path is blocked.
  #    Host networking: the relay needs the 49160-49200 UDP range and the real
  #    public address. EC2 security group must allow 3478 tcp/udp + that range.
  coturn:
    image: coturn/coturn:4.7.0
    container_name: phone-remote-turn
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN:-65-1-96-152.sslip.io}
      # Leave empty to auto-detect the instance's public / private IP.
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
      - TURN_PRIVATE_IP=${TURN_PRIVATE_IP:-}
    volumes:
      - turn-secret:/run/turn:ro
    depends_on:
      turn-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        EXT="$${TURN_EXTERNAL_IP:-$$(detect-external-ip)}"
        [ -n "$$EXT" ] || { echo "could not detect public IP; set TURN_EXTERNAL_IP"; exit 1; }
        PRIV="$${TURN_PRIVATE_IP:-$$(hostname -I | awk '{print $$1}')}"
        [ -n "$$PRIV" ] || { echo "could not detect private IP; set TURN_PRIVATE_IP"; exit 1; }
        cat > /tmp/turnserver.conf <<EOF
        listening-port=3478
        min-port=49160
        max-port=49200
        # Relay only on the instance address (not Docker bridges); AWS 1:1 NAT
        # maps it to the public IP.
        relay-ip=$$PRIV
        external-ip=$$EXT/$$PRIV
        # Both peers relayed through us: their relay addresses are our own
        # private IP, which the private-range deny below would otherwise block.
        # Safe: app/MCP listen on 127.0.0.1 only, not on this address.
        allowed-peer-ip=$$PRIV
        realm=$$DOMAIN
        use-auth-secret
        static-auth-secret=$$(cat /run/turn/secret)
        fingerprint
        no-cli
        no-tls
        no-dtls
        no-multicast-peers
        no-loopback-peers
        denied-peer-ip=0.0.0.0-0.255.255.255
        denied-peer-ip=10.0.0.0-10.255.255.255
        denied-peer-ip=100.64.0.0-100.127.255.255
        denied-peer-ip=127.0.0.0-127.255.255.255
        denied-peer-ip=169.254.0.0-169.254.255.255
        denied-peer-ip=172.16.0.0-172.31.255.255
        denied-peer-ip=192.168.0.0-192.168.255.255
        user-quota=12
        total-quota=200
        log-file=stdout
        simple-log
        EOF
        echo "coturn: realm=$$DOMAIN external-ip=$$EXT"
        exec turnserver -c /tmp/turnserver.conf

volumes:
  turn-secret:
