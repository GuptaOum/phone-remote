services:
  # 1. Reverse Proxy (Nginx with SSL termination & WebSocket routing)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: oumgupta/phone-remote-nginx:latest
    container_name: phone-remote-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - mcp

  # 2. Web Frontend (React + Vite) & Express Node.js Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oumgupta/phone-remote-app:latest
    container_name: phone-remote-app
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - FILE_DIR=/app/filestore
    volumes:
      - ./server/data:/app/server/data
      - /home/ubuntu/PhoneRemote:/app/filestore

  # 3. FastMCP Python Server (AI Agent Tool Endpoint)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: oumgupta/phone-remote-mcp:latest
    container_name: phone-remote-mcp
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./server/.env
    environment:
      - MCP_PORT=8001
      - BACKEND_URL=http://app:3000
    depends_on:
      - app
