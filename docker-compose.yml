services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oumgupta/phone-remote-app:latest
    container_name: phone-remote-app
    restart: unless-stopped
    # Nginx proxies 443 → 127.0.0.1:3000 (React Frontend + Express Backend)
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - FILE_DIR=/app/filestore
    volumes:
      - ./server/data:/app/server/data
      - /home/ubuntu/PhoneRemote:/app/filestore

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: oumgupta/phone-remote-mcp:latest
    container_name: phone-remote-mcp
    restart: unless-stopped
    # Nginx proxies /sse & /messages/ → 127.0.0.1:8001 (FastMCP Python Server)
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./server/.env
    environment:
      - MCP_PORT=8001
      - BACKEND_URL=http://app:3000
    depends_on:
      - app
