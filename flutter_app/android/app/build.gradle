plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.newDataInputStream().withCloseable { stream ->
        localProperties.load(stream)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.phoneremote"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.phoneremote"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Release APKs are 64-bit ARM only (every phone from the last ~6 years):
    // build with --target-platform android-arm64 (tool/build_release_apk.sh).
    // Plugins and libwebrtc's AAR still bring their own .so for other ABIs,
    // and ndk.abiFilters is overridden by Flutter's Gradle plugin, so drop
    // those folders at packaging time. Otherwise a 32-bit phone would get
    // libwebrtc without libflutter and crash.
    // Release only, so `flutter run` on an x86 emulator keeps working.
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
        packagingOptions {
            jniLibs {
                excludes += ['lib/armeabi-v7a/**', 'lib/x86/**', 'lib/x86_64/**']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Keep rules for JNI-reached classes (libwebrtc) — see proguard-rules.pro.
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.github.webrtc-sdk:android:144.7559.15"
}
